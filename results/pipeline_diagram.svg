<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 250" font-family="Segoe UI, Arial, sans-serif">
  <!-- backdrop -->
  <rect x="6" y="6" width="1148" height="238" rx="16" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="28" y="34" fill="#0f172a" font-size="16" font-weight="700">Pose-Invariant Face Verification — pipeline</text>

  <!-- ===== Stage 1: FEI images ===== -->
  <rect x="28" y="70" width="190" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="123" y="96" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">FEI images</text>
  <!-- profile face @70,140 -->
  <circle cx="70" cy="140" r="14" fill="#e8ecf3" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="76" cy="137" r="1.7" fill="#334155"/>
  <path d="M59,140 l-4,3 l4,3 z" fill="#334155"/>
  <path d="M72,147 Q76,149 79,146" fill="none" stroke="#334155" stroke-width="1.3"/>
  <!-- half face @123,140 -->
  <circle cx="123" cy="140" r="14" fill="#e8ecf3" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="123" cy="137" r="1.7" fill="#334155"/>
  <circle cx="130" cy="137" r="1.7" fill="#334155"/>
  <path d="M117,139 l-3,3 l3,2 z" fill="#334155"/>
  <path d="M122,146 Q126,149 129,146" fill="none" stroke="#334155" stroke-width="1.3"/>
  <!-- frontal face @176,140 -->
  <circle cx="176" cy="140" r="14" fill="#e8ecf3" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="171" cy="137" r="1.7" fill="#334155"/>
  <circle cx="181" cy="137" r="1.7" fill="#334155"/>
  <path d="M172,146 Q176,149 180,146" fill="none" stroke="#334155" stroke-width="1.3"/>
  <text x="123" y="190" fill="#475569" font-size="11" text-anchor="middle">200 subjects × 14 poses</text>
  <text x="123" y="206" fill="#475569" font-size="11" text-anchor="middle">= 2800 images</text>

  <!-- ===== Stage 2: Detect + Align ===== -->
  <rect x="270" y="70" width="190" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="365" y="96" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Detect + Align</text>
  <rect x="343" y="118" width="44" height="44" rx="4" fill="none" stroke="#4c72b0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="365" cy="140" r="14" fill="#e8ecf3" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="360" cy="137" r="1.7" fill="#334155"/>
  <circle cx="370" cy="137" r="1.7" fill="#334155"/>
  <path d="M361,146 Q365,149 369,146" fill="none" stroke="#334155" stroke-width="1.3"/>
  <text x="365" y="190" fill="#475569" font-size="11" text-anchor="middle">RetinaFace · 112×112</text>
  <text x="365" y="206" fill="#475569" font-size="11" text-anchor="middle">2782 aligned crops</text>

  <!-- ===== Stage 3: ArcFace embed ===== -->
  <rect x="512" y="70" width="190" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="607" y="96" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">ArcFace embed</text>
  <rect x="565" y="126" width="10" height="10" rx="2" fill="#4c72b0"/>
  <rect x="579" y="126" width="10" height="10" rx="2" fill="#7aa0cc"/>
  <rect x="593" y="126" width="10" height="10" rx="2" fill="#4c72b0"/>
  <rect x="607" y="126" width="10" height="10" rx="2" fill="#7aa0cc"/>
  <rect x="621" y="126" width="10" height="10" rx="2" fill="#4c72b0"/>
  <rect x="635" y="126" width="10" height="10" rx="2" fill="#7aa0cc"/>
  <text x="607" y="164" fill="#475569" font-size="11" text-anchor="middle">512-d vector</text>
  <text x="607" y="190" fill="#475569" font-size="11" text-anchor="middle">buffalo_l · w600k_r50</text>
  <text x="607" y="206" fill="#475569" font-size="11" text-anchor="middle">cosine similarity</text>

  <!-- ===== Stage 4: Split + Evaluate ===== -->
  <rect x="754" y="70" width="190" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="849" y="96" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Split + Evaluate</text>
  <polyline points="806,158 806,120 845,120 845,134 884,134 884,114" fill="none" stroke="#4c72b0" stroke-width="2"/>
  <circle cx="806" cy="158" r="2.5" fill="#4c72b0"/>
  <text x="849" y="182" fill="#475569" font-size="11" text-anchor="middle">identity-disjoint 160/20/20</text>
  <text x="849" y="198" fill="#475569" font-size="11" text-anchor="middle">ROC · EER · TAR@FAR</text>
  <text x="849" y="214" fill="#475569" font-size="11" text-anchor="middle">by pose-bin</text>

  <!-- ===== Stage 5: Result / Demo ===== -->
  <rect x="996" y="70" width="140" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1066" y="96" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Result / Demo</text>
  <circle cx="1066" cy="140" r="20" fill="#e6f4ea" stroke="#2e7d47" stroke-width="2"/>
  <path d="M1056,140 l7,7 l13,-15" fill="none" stroke="#2e7d47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1066" y="190" fill="#475569" font-size="11" text-anchor="middle">"same person?"</text>
  <text x="1066" y="206" fill="#475569" font-size="11" text-anchor="middle">Gradio · UMAP · FAISS</text>

  <!-- ===== arrows ===== -->
  <line x1="222" y1="145" x2="260" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="260,141 267,145 260,149" fill="#94a3b8"/>
  <line x1="464" y1="145" x2="502" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="502,141 509,145 502,149" fill="#94a3b8"/>
  <line x1="706" y1="145" x2="744" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="744,141 751,145 744,149" fill="#94a3b8"/>
  <line x1="948" y1="145" x2="986" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="986,141 993,145 986,149" fill="#94a3b8"/>
</svg>
